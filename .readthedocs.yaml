# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
    nodejs: "20"

  commands:
    - pip install jupyter-book
    # stamp the footer with the date of the commit being built
    - sed -i "s/^Last updated .*/Last updated $(git log -1 --format=%cd --date=format:'%-d %B %Y')/" docs/footer.md
    - cd docs && jupyter-book build --html
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - cp -r docs/_build/html/* $READTHEDOCS_OUTPUT/html/
    # standalone interactive demos, embedded by iframe (MyST does not copy these)
    - mkdir -p $READTHEDOCS_OUTPUT/html/demo
    - cp docs/_static/demo/*.html $READTHEDOCS_OUTPUT/html/demo/